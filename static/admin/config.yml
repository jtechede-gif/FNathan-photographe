backend:
  name: git-gateway
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}
      - {label: "Ordre", name: "weight", widget: "number", required: false}

  - name: "projects"
    label: "Projects"
    folder: "content/portfolio/les-projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Catégorie", name: "categorie", widget: "string"}
      - {label: "Image à la une", name: "featured_image", widget: "image"}
      - {label: "Galerie", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Contenu", name: "body", widget: "markdown", required: false}